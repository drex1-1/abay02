<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABAY DOWNLOADER</title>
<style>
  :root{
    --red:#fe2c55;
    --cyan:#25f4ee;
    --bg:#0a0a0c;
    --panel:#141417;
    --panel-2:#1c1c20;
    --line:#28282c;
    --text:#f4f4f5;
    --muted:#8a8a92;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:
      radial-gradient(600px 300px at 15% -5%, rgba(254,44,85,.14), transparent 60%),
      radial-gradient(500px 260px at 100% 0%, rgba(37,244,238,.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    text-align:center;
    padding:40px 20px 60px;
    min-height:100vh;
  }
  h1{
    color:var(--red);
    font-size:clamp(30px,8vw,44px);
    font-weight:900;
    letter-spacing:-.01em;
    margin:10px 0 0;
  }
  .flame{font-size:28px;display:block;margin-top:4px}
  .tagline{color:var(--muted);font-size:15px;margin:10px 0 0;font-weight:500}

  .card{
    background:var(--panel);
    padding:22px 18px;
    border-radius:20px;
    max-width:460px;
    margin:28px auto 0;
    border:1px solid var(--line);
  }

  input{
    width:100%;
    padding:16px;
    border-radius:14px;
    border:1.5px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    font-size:16px;
    outline:none;
    transition:border-color .15s;
  }
  input:focus{border-color:var(--red)}
  input::placeholder{color:#54545a}

  button{
    background:var(--red);
    color:#fff;
    border:none;
    padding:16px;
    border-radius:14px;
    margin-top:14px;
    font-size:16px;
    font-weight:800;
    width:100%;
    cursor:pointer;
    letter-spacing:.01em;
    transition:transform .1s;
  }
  button:active{transform:scale(.98)}

  #result{margin-top:18px;text-align:left}
  .loading{
    color:var(--muted);
    font-size:14px;
    font-weight:600;
    text-align:center;
    padding:10px 0;
  }
  .error-msg{
    color:var(--red);
    font-size:14px;
    font-weight:600;
    text-align:center;
    padding:10px 0;
  }

  video{
    width:100%;
    border-radius:14px;
    background:#000;
    margin-top:4px;
    display:block;
  }

  a.down{
    display:block;
    background:#fff;
    color:#0a0a0c;
    padding:15px;
    border-radius:12px;
    text-decoration:none;
    font-weight:800;
    text-align:center;
    margin-top:12px;
    font-size:14.5px;
  }

  footer{color:#54545a;font-size:12px;margin-top:40px}
</style>
</head>
<body>

<h1>ABAY DOWNLOADER</h1>
<span class="flame">🔥</span>
<p class="tagline">TikTok · No Watermark · Fast & Free</p>

<div class="card">
  <input id="url" placeholder="Paste TikTok link here...">
  <button onclick="download()">DOWNLOAD NOW</button>
  <div id="result"></div>
</div>

<footer>Built by ABAY 01 — Port Harcourt</footer>

<script>
async function download(){
  let url = document.getElementById('url').value;
  if(!url) return alert("Paste link first!");
  document.getElementById('result').innerHTML = '<div class="loading">⏳ Loading...</div>';
  try{
    let api = `https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`;
    let res = await fetch(api);
    let data = await res.json();
    if(data.data){
      let videoUrl = data.data.play;
      document.getElementById('result').innerHTML = `
        <video controls src="${videoUrl}"></video>
        <a class="down" href="${videoUrl}" target="_blank">⬇️ DOWNLOAD VIDEO</a>
      `;
    } else {
      document.getElementById('result').innerHTML = '<div class="error-msg">❌ Failed. Try another TikTok link.</div>';
    }
  } catch(e){
    document.getElementById('result').innerHTML = '<div class="error-msg">❌ Error: ' + e + '</div>';
  }
}
</script>
</body>
</html>
